<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Document Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FDFBF7] flex items-center justify-center min-h-screen text-gray-800">

    <div class="bg-white border border-[#E5E0D5] p-8 rounded-xl shadow-sm w-full max-w-md">
        <h1 class="text-2xl font-bold text-[#6A1B29] mb-6 text-center">Staff Sign In</h1>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="staff@organization.com" class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29]">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29]">
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-[#6A1B29] text-[#FDFBF7] py-2 rounded-lg font-semibold hover:bg-[#52131F] transition">Sign In</button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account? 
            <a href="signup.html" class="text-[#6A1B29] font-semibold hover:underline">Sign Up</a>
        </p>
        
        <div class="text-center mt-4">
            <a href="index.html" class="text-sm text-gray-500 hover:underline">← Back to Public Tracker</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://zbfybgvjlnkdrptdkaih.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiZnliZ3ZqbG5rZHJwdGRrYWloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NDQ3MDQsImV4cCI6MjEwNzMyMDcwNH0.dBMOi8ghiepkbM8_3IE6d4pfszbY4NgGKpVstm29jgs";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerText = "Signing in...";

            const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });
            
            if (authError) {
                alert("Login failed: " + authError.message);
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
                return;
            }

            // Check user role from profiles table for role-based routing
            const { data: profile, error: profileError } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', authData.user.id)
                .single();

            if (profileError || !profile) {
                alert("User profile not found.");
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
                return;
            }

            // Role-based UI redirection
            if (profile.role === 'staff') {
                window.location.href = "dashboard.html"; // Staff Management UI
            } else {
                window.location.href = "index.html"; // Public / Default View UI
            }
        }
    </script>
</body>
</html>
