<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Sign Up - Document Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FDFBF7] flex items-center justify-center min-h-screen text-gray-800">

    <div class="bg-white border border-[#E5E0D5] p-8 rounded-xl shadow-sm w-full max-w-md">
        <h1 class="text-2xl font-bold text-[#6A1B29] mb-2 text-center">Staff Registration</h1>
        <p class="text-sm text-gray-600 mb-6 text-center">Enter your official details and passcode to create a staff account.</p>

        <form id="signupForm" onsubmit="handleSignUp(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" required placeholder="e.g. Siti Aminah" class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29]">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Department / Position</label>
                <input type="text" id="department" required placeholder="e.g. Academic Affairs / Registrar" class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29]">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="staff@organization.com" class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29]">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29]">
                <p class="text-xs text-gray-500 mt-1">Min 8 chars, must include uppercase, lowercase, number & special char (@$!%*?&).</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Staff Access Passcode</label>
                <input type="password" id="passcode" required placeholder="Enter secret code" class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29]">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-[#6A1B29] text-[#FDFBF7] py-2 rounded-lg font-semibold hover:bg-[#52131F] transition mt-2">Create Account</button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Already have an account? 
            <a href="login.html" class="text-[#6A1B29] font-semibold hover:underline">Sign In</a>
        </p>
        
        <div class="text-center mt-4">
            <a href="index.html" class="text-sm text-gray-500 hover:underline">← Back to Public Tracker</a>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://zbfybgvjlnkdrptdkaih.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_r6kKJsXjDxQ5Skiei6iFAg_t5oesmBj";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Custom secret passcode
        const STAFF_SECRET_PASSCODE = "PPDPEMBELAJARAN"; 

        // Strong password regex checker
        function isPasswordStrong(pwd) {
            const strongRegex = new RegExp("^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#\$%\^&\*])(?=.{8,})");
            return strongRegex.test(pwd);
        }

        async function handleSignUp(event) {
            event.preventDefault(); // Prevent default page refresh

            const submitBtn = document.getElementById('submitBtn');
            const fullName = document.getElementById('fullName').value.trim();
            const department = document.getElementById('department').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const enteredPasscode = document.getElementById('passcode').value.trim();

            // 1. Verify Passcode
            if (enteredPasscode !== STAFF_SECRET_PASSCODE) {
                alert("Invalid Staff Access Passcode! Access denied.");
                return;
            }

            // 2. Verify Strong Password
            if (!isPasswordStrong(password)) {
                alert("Password is too weak!\nIt must contain at least:\n- 8 characters\n- 1 uppercase letter\n- 1 lowercase letter\n- 1 number\n- 1 special character (e.g. @$!%*?&)");
                return;
            }

            // Update button state to loading
            submitBtn.disabled = true;
            submitBtn.innerText = "Creating account...";

            try {
                // 3. Register user in Supabase Authentication
                const { data: authData, error: authError } = await supabase.auth.signUp({ 
                    email: email, 
                    password: password 
                });

                if (authError) {
                    alert("Registration failed: " + authError.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Create Account";
                    return;
                }

                if (authData.user) {
                    // 4. Save profile information into 'profiles' table
                    const { error: profileError } = await supabase.from('profiles').insert([
                        { 
                            id: authData.user.id, 
                            full_name: fullName, 
                            department: department, 
                            role: 'staff' 
                        }
                    ]);

                    if (profileError) {
                        alert("Account created, but profile save failed: " + profileError.message);
                    } else {
                        alert("Staff account created successfully! Redirecting to Sign In...");
                        window.location.href = "login.html";
                    }
                }
            } catch (err) {
                alert("An unexpected error occurred: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Create Account";
            }
        }
    </script>
</body>
</html>
